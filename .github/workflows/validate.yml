name: Validate plugins

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - name: Validate with Claude Code
        run: |
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate --strict plugins/terminal49
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate --strict .
