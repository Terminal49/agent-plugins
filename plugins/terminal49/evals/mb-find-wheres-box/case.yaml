schema_version: "1.1"
name: mb-find-wheres-box
tags: [tier-a, tier-f, marketingbuddy, find]
execution:
  prompt: "Where’s my box TGBU1234567?"
  allowed_tools: [Skill]
graders:
  - { name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"', arm: with-only }
  - { name: find-order, type: tool_order, before: mcp__plugin_terminal49_terminal49__search_container, after: mcp__plugin_terminal49_terminal49__get_container, arm: with-only }
  - { name: no-track, type: tool_used, tool: mcp__plugin_terminal49_terminal49__track_container, min: 0, max: 0, arm: with-only }
  - name: answer
    type: llm
    criteria: |
      PASS if the answer finds TGBU1234567 discharged at the Port of Los Angeles,
      flags the active customs hold, and does not create tracking.
      FAIL if it invents another status or location, misses the hold, or starts tracking.
