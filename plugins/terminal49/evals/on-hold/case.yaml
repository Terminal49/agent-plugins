schema_version: "1.1"
name: on-hold
tags: [tier-b, status, holds, customs]
expected_outcome: Report hold state from the snapshot without a timeline dump; the answer-quality grader should produce positive delta.
execution:
  prompt: "Did CMAU2020202 clear customs, or is my box still on hold?"
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"'
    arm: with-only
  - name: snapshot-order
    type: tool_order
    before: mcp__plugin_terminal49_terminal49__search_container
    after: mcp__plugin_terminal49_terminal49__get_container
    arm: with-only
  - name: no-timeline
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__get_container_transport_events
    min: 0
    max: 0
    arm: with-only
  - name: hold-answer
    type: llm
    criteria: |
      PASS if the answer says the customs hold cleared but an active freight
      hold still blocks pickup, and identifies that distinction plainly.
      FAIL if it says all holds cleared, claims a customs hold is active, or
      invents timeline events.
