schema_version: "1.1"
name: do-not-invent-milestones
tags: [tier-e, guardrail, milestones]
expected_outcome: Preserve unknown discharge state without inventing a milestone; the answer-quality grader should produce positive delta.
execution:
  prompt: "Has TRHU5555555 discharged yet?"
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"'
    arm: with-only
  - name: snapshot-order
    type: tool_order
    before: mcp__plugin_terminal49_terminal49__search_container
    after: mcp__plugin_terminal49_terminal49__get_container
    arm: with-only
  - name: no-track-create
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__track_container
    min: 0
    max: 0
    arm: with-only
  - name: milestone-answer
    type: llm
    criteria: |
      PASS if the answer says discharge is unknown or not confirmed because no
      discharge timestamp or event is present. It may offer an event check but
      must not claim the discharge happened.
      FAIL if it states the container discharged, treats missing data as proof
      that it did not discharge, or invents a milestone date.
