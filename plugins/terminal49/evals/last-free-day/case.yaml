schema_version: "1.1"
name: last-free-day
tags: [tier-b, status, lfd, demurrage]
expected_outcome: Report LFD pressure without calculating a fee or dumping a timeline; the answer-quality grader should produce positive delta.
execution:
  prompt: "What's the LFD for HLCU3030303? Am I going to get demurrage?"
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"'
    arm: with-only
  - name: snapshot-order
    type: tool_order
    before: mcp__plugin_terminal49_terminal49__search_container
    after: mcp__plugin_terminal49_terminal49__get_container
    arm: with-only
  - name: no-timeline
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__get_container_transport_events
    min: 0
    max: 0
    arm: with-only
  - name: lfd-answer
    type: llm
    criteria: |
      PASS if the answer states the LFD is 2026-09-13, pickup is available,
      no holds are active, and demurrage is a risk after LFD rather than a
      confirmed fee. It must not calculate a charge.
      FAIL if it omits LFD, claims a fee is already due, invents a tariff, or
      dumps a full movement timeline.
