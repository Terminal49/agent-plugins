schema_version: "1.1"
name: route-entitlement-miss
tags: [tier-e, guardrail, entitlement, route]
expected_outcome: Distinguish route entitlement from identifier validity; the answer-quality grader should produce positive delta.
execution:
  prompt: "Show me the route for SEGU4444444."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"'
    arm: with-only
  - name: route-lookup-order
    type: tool_order
    before: mcp__plugin_terminal49_terminal49__search_container
    after: mcp__plugin_terminal49_terminal49__get_container_route
    arm: with-only
  - name: no-track-create
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__track_container
    min: 0
    max: 0
    arm: with-only
  - name: entitlement-answer
    type: llm
    criteria: |
      PASS if the answer says SEGU4444444 was found but route details are not
      enabled for the account, and does not call the identifier invalid.
      FAIL if it reports not-found or bad ID, invents a route, or starts tracking.
