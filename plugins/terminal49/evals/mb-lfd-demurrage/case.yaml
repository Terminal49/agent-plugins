schema_version: "1.1"
name: mb-lfd-demurrage
tags: [tier-b, tier-f, marketingbuddy, lfd]
execution:
  prompt: |
    I'm looking at TGBU1234567.

    Am I going to get demurrage on this?
  allowed_tools: [Skill]
graders:
  - { name: skill-fired, type: tool_used, tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"', arm: with-only }
  - { name: snapshot-order, type: tool_order, before: mcp__plugin_terminal49_terminal49__search_container, after: mcp__plugin_terminal49_terminal49__get_container, arm: with-only }
  - { name: no-timeline, type: tool_used, tool: mcp__plugin_terminal49_terminal49__get_container_transport_events, min: 0, max: 0, arm: with-only }
  - name: answer
    type: llm
    criteria: |
      PASS if the answer gives LFD 2026-09-14, says two calendar days remain as
      of 2026-09-12, flags the customs hold, and calls demurrage a risk, not a fee.
      FAIL if it calculates a charge, omits LFD, or invents tariff terms.
