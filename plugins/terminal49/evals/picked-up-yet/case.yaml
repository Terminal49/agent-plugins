schema_version: "1.1"
name: picked-up-yet
tags: [tier-b, status, pickup]
expected_outcome: Answer from the current snapshot without a timeline dump; the answer-quality grader should produce positive delta.
execution:
  prompt: "Picked up yet? Container MEDU1010101."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"'
    arm: with-only
  - name: snapshot-order
    type: tool_order
    before: mcp__plugin_terminal49_terminal49__search_container
    after: mcp__plugin_terminal49_terminal49__get_container
    arm: with-only
  - name: no-timeline
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__get_container_transport_events
    min: 0
    max: 0
    arm: with-only
  - name: pickup-answer
    type: llm
    criteria: |
      PASS if the answer says MEDU1010101 was picked up on 2026-09-11 from
      Fixture Terminal B and does not dump or invent a movement timeline.
      FAIL if pickup is unknown, the container is still at the terminal, or
      unrelated milestones are presented.
