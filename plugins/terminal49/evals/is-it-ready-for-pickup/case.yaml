schema_version: "1.1"
name: is-it-ready-for-pickup
tags: [tier-f, phrasing, pickup]
expected_outcome: Readiness phrasing triggers the same safe snapshot as the base status case; the answer-quality grader should produce positive delta.
execution:
  prompt: "Is TGBU1234567 ready for pickup yet?"
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"'
    arm: with-only
  - name: status-lookup-order
    type: tool_order
    before: mcp__plugin_terminal49_terminal49__search_container
    after: mcp__plugin_terminal49_terminal49__get_container
    arm: with-only
  - name: no-timeline
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__get_container_transport_events
    min: 0
    max: 0
    arm: with-only
  - name: pickup-answer
    type: llm
    criteria: |
      PASS if the answer says pickup is currently blocked by an active customs
      hold and states the 2026-09-14 LFD. It must not promise a pickup time.
      FAIL if it says the box is ready, omits the blocker, invents a clearance
      time, or dumps a full event timeline.
