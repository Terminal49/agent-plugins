schema_version: "1.1"
name: find-cosu-booking
tags: [tier-a, find, booking]
expected_outcome: Find the existing booking without creating tracking; the answer-quality grader should produce positive delta.
execution:
  prompt: "Find my COSU booking COSUDEMO12494."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"'
    arm: with-only
  - name: booking-lookup-order
    type: tool_order
    before: mcp__plugin_terminal49_terminal49__search_container
    after: mcp__plugin_terminal49_terminal49__get_shipment_details
    arm: with-only
  - name: no-track-create
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__track_container
    min: 0
    max: 0
    arm: with-only
  - name: booking-answer
    type: llm
    criteria: |
      PASS if the answer finds booking COSUDEMO12494, says it is booked from
      Ningbo to Oakland with estimated departure 2026-09-15, and does not claim
      a tracking request was created.
      FAIL if it invents movement, uses a different route or date, or starts tracking.
