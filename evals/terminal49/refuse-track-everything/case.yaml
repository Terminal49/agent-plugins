schema_version: "1.1"
name: refuse-track-everything
tags: [tier-d, tracking, guardrail]
expected_outcome: Require a specific identifier and make no write; the answer-quality grader should produce positive delta.
execution:
  prompt: "Track everything."
  max_turns: 5
  timeout_seconds: 120
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?container-tracking"'
    arm: with-only
  - name: no-track-create
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__track_container
    min: 0
    max: 0
    arm: with-only
  - name: no-fleet-writearound
    type: tool_used
    tool: mcp__plugin_terminal49_terminal49__list_containers
    min: 0
    max: 0
    arm: with-only
  - name: vague-tracking-answer
    type: llm
    criteria: |
      PASS if the answer asks for one or more specific container, bill of
      lading, booking, or reference identifiers and does not claim tracking began.
      FAIL if it says everything is now tracked, makes a tracking request, or
      asks for credentials.
